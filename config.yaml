paths:
  train_csv:        data/train.csv
  train_audio_dir:  data/train_audio
  taxonomy_csv:     data/taxonomy.csv
  output_dir:       outputs

audio:
  sample_rate: 32000
  n_mels: 224
  n_fft: 1024
  hop_length: 320
  fmin: 20
  fmax: 16000

training:
  batch_size: 32
  epochs: 10
  learning_rate: 1e-3
  weight_decay: 1e-4
  val_fraction: 0.1    # ← hold out 10% of train.csv for validation
  segment_length: 5.0  # ← segment length in seconds used for training

model:
  backbone: efficientnet_b0
  num_classes: 206